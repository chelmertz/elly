# Read by `make mutate`. The thresholds live here because gremlins v0.6.0
# ignores --threshold-efficacy and --threshold-mcover: viper hands the bound
# float flag back as a string, the typed lookup turns that into 0, and 0
# disables the check. The run fails when a value is at or below its
# threshold, so each sits just under the last measured run.
#
# Efficacy is below 100 because 20 surviving mutants are equivalent: the
# mutated code behaves the same on every input (a clamp to a value it already
# has, a sort over keys that are never equal, a ++ on a counter that is only
# compared for change, as clears and ownerDeletes in the server). One new
# survivor takes efficacy under the threshold.
unleash:
  threshold:
    efficacy: 97.4
    mutant-coverage: 83.6
