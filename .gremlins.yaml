# Read by `make mutate`. The thresholds live here because gremlins v0.6.0
# ignores --threshold-efficacy and --threshold-mcover: viper hands the bound
# float flag back as a string, the typed lookup turns that into 0, and 0
# disables the check. The run fails when a value is at or below its
# threshold, so each sits just under the last measured run.
#
# Efficacy is below 100 because 21 surviving mutants are equivalent: the
# mutated code behaves the same on every input. Measured 2026-11-21:
#   clamps to a value already held: backoff.go 98, 117, 133, 146, 148;
#     next.go 456; server.go 261
#   sorts over keys that are never equal: check.go 38, github.go 795,
#     points.go 177, server.go 146
#   ties that pick the same value: next.go 268, 431
#   empty input does nothing either way: check.go 171, github.go 386, 781
#   counters only compared for change: changes.go 47, server.go 541, 558
#   a startup step that fails later anyway or is rerun as a no-op:
#     storage.go 153, 211
# One new survivor takes efficacy under the threshold; kill it or add it here.
unleash:
  threshold:
    efficacy: 97.5
    mutant-coverage: 84.7
